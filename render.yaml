services:
  - type: web
    name: evaluatebrand-sentiments
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:web
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIBRETRANSLATE_URL
        sync: false
